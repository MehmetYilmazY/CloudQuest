<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cloud Engineering bana uygun mu? — CloudQuest</title>
  <meta name="description" content="10 soruda dürüst bir uyum testi. Cloud engineering sana göre mi, yoksa başka bir rol mü daha iyi oturur?" />
  <meta name="color-scheme" content="dark" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E%F0%9F%A7%AA%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="quiz-body">
  <div class="grid-bg"></div>

  <div class="q-progress"><div class="q-progress-fill" id="q-progress-fill"></div></div>

  <header class="q-header">
    <a class="t-back" href="index.html">← CloudQuest</a>
    <div class="q-title-bar">🧪 Bu iş bana uygun mu? <span class="q-sub">10 soru · dürüst sonuç</span></div>
    <div class="q-counter" id="q-counter">1 / 10</div>
  </header>

  <main class="q-main">
    <div id="q-stage"></div>
  </main>

  <div class="scanlines" aria-hidden="true"></div>

  <script src="js/lib/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/quiz.js"></script>
  <script>
    // Test girişsiz çalışır. Oturum varsa bitişte rozet yazılır.
    (function () {
      var awarded = false;
      function award(badge) {
        if (awarded) return; awarded = true;
        try {
          if (!Auth.isConfigured() || !Auth.currentEmail()) return;
          var p = Auth.getProfile(); if (!p) return;
          p.badges = p.badges || [];
          if (p.badges.indexOf(badge) === -1) {
            p.badges.push(badge);
            p.xp = (p.xp || 0) + 20;
            Auth.saveProfile(p); Auth.flush && Auth.flush();
          }
        } catch (e) {}
      }
      Quiz.mount(document.getElementById("q-stage"), { onFinish: award });
      if (window.Auth && Auth.isConfigured) { Auth.init(); }
    })();
  </script>
</body>
</html>
