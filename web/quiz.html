<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="title.quiz">Cloud Engineering bana uygun mu? — CloudQuest</title>
  <meta name="description" content="10 soruda dürüst bir uyum testi. Cloud engineering sana göre mi, yoksa başka bir rol mü daha iyi oturur?" data-i18n-attr="content:meta.quiz.desc" />
  <meta name="color-scheme" content="dark" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E%F0%9F%A7%AA%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
  <!-- i18n, diger scriptlerden ONCE: dogru dil bundle'ini secer. -->
  <script src="js/strings.generated.js"></script>
  <script src="js/i18n.js"></script>
</head>
<body class="quiz-body">
  <canvas id="stars" aria-hidden="true"></canvas>
  <div class="nebula" aria-hidden="true"></div>
  <div class="grid-bg"></div>

  <div class="q-progress"><div class="q-progress-fill" id="q-progress-fill"></div></div>

  <header class="q-header">
    <a class="t-back" href="index.html">← CloudQuest</a>
    <div class="q-title-bar"><span data-i18n="page.quiz.title">🧪 Bu iş bana uygun mu?</span> <span class="q-sub" data-i18n="page.quiz.sub">10 soru · dürüst sonuç</span></div>
    <span class="lang-switch-wrap" data-lang-switch></span>
    <div class="q-counter" id="q-counter">1 / 10</div>
  </header>

  <main class="q-main">
    <div id="q-stage"></div>
  </main>

  <div class="scanlines" aria-hidden="true"></div>
  <script src="js/stars.js"></script>

  <script src="js/lib/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/quiz.js"></script>
  <script>
    // Test girişsiz çalışır. Oturum varsa bitişte rozet yazılır.
    (function () {
      var awarded = false;
      // Rozet ve XP'yi SUNUCU verir (Katman 1). Buradan gönderilen tek şey
      // "testi bitirdim" bilgisi; rozetin adını ve değerini istemci seçemez.
      function award() {
        if (awarded) return; awarded = true;
        if (!Auth.isConfigured() || !Auth.currentEmail()) return;   // girişsiz de oynanır
        CQApi.milestone("quiz").catch(function (e) {
          console.warn("rozet verilemedi:", e && e.message);
        });
      }
      Quiz.mount(document.getElementById("q-stage"), { onFinish: award });
      if (window.Auth && Auth.isConfigured) { Auth.init(); }
    })();
  </script>
</body>
</html>
