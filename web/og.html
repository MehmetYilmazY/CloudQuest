<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>CloudQuest — OG kartı (1200×630)</title>
  <!--
    Bu sayfa SİTENİN PARÇASI DEĞİL: paylaşım görselini (og.png) üretmek için var.
    Arama motorlarına kapalı (robots.txt) ve hiçbir yerden link verilmiyor.

    PNG üretmek:
      1) Bu dosyayı tarayıcıda aç, pencereyi 1200×630'a getir
         (DevTools → Device Toolbar → Responsive → 1200 x 630)
      2) Ekran görüntüsü al → web/og.png olarak kaydet
      Alternatif: npx playwright screenshot --viewport-size=1200,630 \
                    web/og.html web/og.png
  -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px; height: 630px; overflow: hidden;
      background: #06070a; color: #f2f5fa;
      font-family: "Cascadia Code", "JetBrains Mono", Consolas, ui-monospace, monospace;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 62px 68px; position: relative;
    }
    .grid {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(34,211,238,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34,211,238,.05) 1px, transparent 1px);
      background-size: 64px 64px;
      -webkit-mask-image: linear-gradient(180deg, #000, transparent 70%);
      mask-image: linear-gradient(180deg, #000, transparent 70%);
    }
    .top, .bottom, .mid { position: relative; }
    .logo { font-size: 20px; letter-spacing: .2em; color: #22d3ee; }
    h1 {
      font-family: "Inter", "Segoe UI", system-ui, sans-serif;
      font-size: 92px; font-weight: 900; letter-spacing: -.05em; line-height: .95;
    }
    .mark { color: #22d3ee; box-shadow: inset 0 -.1em 0 rgba(34,211,238,.3); }
    .sub { margin-top: 26px; font-size: 23px; color: #9aa4b8; max-width: 24ch; }
    .bottom { display: flex; align-items: flex-end; justify-content: space-between; }
    .figs { display: flex; gap: 40px; }
    .fig b {
      display: block; font-family: "Inter", system-ui, sans-serif;
      font-size: 40px; font-weight: 900; letter-spacing: -.03em;
    }
    .fig span { font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: #5b6478; }
    .term {
      border: 1px solid #2a3145; background: #080b12; padding: 16px 20px;
      font-size: 17px; line-height: 1.9; min-width: 380px;
    }
    .p { color: #4ade80; }
    .ok { color: #4ade80; }
    .dim { color: #5b6478; }
  </style>
</head>
<body>
  <div class="grid"></div>

  <div class="top"><div class="logo">☁ CLOUDQUEST</div></div>

  <div class="mid">
    <h1>Cloud Engineer<br />olmayı <span class="mark">oynayarak</span><br />öğren.</h1>
    <p class="sub">Video izleme. Komutu sen yaz.</p>
  </div>

  <div class="bottom">
    <div class="figs">
      <div class="fig"><b>8</b><span>bölüm</span></div>
      <div class="fig"><b>54</b><span>quest</span></div>
      <div class="fig"><b>211</b><span>görev</span></div>
    </div>
    <div class="term">
      <div><span class="p">engineer@meridian:~$</span> chmod +x deploy.sh</div>
      <div class="ok">✔ artık çalıştırılabilir.</div>
      <div class="dim">+60 XP · rozet: First Login</div>
    </div>
  </div>
</body>
</html>
