name: Deploy CloudQuest (web) → GitHub Pages

# curriculum.json'dan web/js/content.generated.js üretir ve web/ klasörünü
# GitHub Pages'e yayınlar. main'e her push'ta çalışır.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build (SSOT: curriculum.json → content.generated.js)
        shell: pwsh
        run: ./build.ps1

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact (web/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
